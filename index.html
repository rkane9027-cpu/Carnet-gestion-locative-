    root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#0B0F14;color:#fff;text-align:center;">' +

  }
}
window.addEventListener('error', function(e){
  if (!window.__carnetMounted) showRootFatal((e.message || 'Erreur inconnue') + ' — vérifie ta connexion internet, ou ouvre cette page via son lien hébergé plutôt que depuis les téléchargements.');
});
window.addEventListener('unhandledrejection', function(e){
  if (!window.__carnetMounted) showRootFatal(String((e.reason && e.reason.message) || e.reason || 'Erreur inconnue'));
});
setTimeout(function(){

<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF2F6; --text:#1B2531; --text-dim:#63707C; --border:#DEE4EA;
  --primary:#0E4C86; --primary-dark:#0A3A68; --primary-soft:#E7F0F9; --accent:#A9812F;
  --success:#1E8E5F; --success-soft:#E5F5ED; --warn:#B07A1E; --warn-soft:#FAF1E1;
  --shadow:0 1px 2px rgba(20,27,36,.05), 0 6px 16px rgba(20,27,36,.05);
}
[data-theme="dark"]{
  --bg:#0F141A; --surface:#171E26; --surface-2:#1F2830; --text:#E7ECF1; --text-dim:#8A97A3; --border:#2A3541;
  --primary:#4A9EE8; --primary-dark:#2E7BC4; --primary-soft:rgba(74,158,232,.16); --accent:#D2AE4D;

body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }

.btn-primary{ display:inline-flex; align-items:center; justify-content:center; background:var(--primary); color:#FFF; border:none; padding:13px 22px; border-radius:9px; font-weight:600; font-size:15px; cursor:pointer; transition:background .15s; }

.mini-list{ display:flex; flex-direction:column; gap:9px; }

<body>
<div id="root"></div>

<script type="text/plain" id="carnet-app-source">
const { useState, useEffect, useRef, useCallback } = React;

/* ======================================================
   Vidéo du hero — générée par Ralph via Google Flow.
   Remplace HERO_VIDEO_SRC si tu regénères une nouvelle vidéo.
   ====================================================== */
const HERO_VIDEO_SRC = "https://labs.google/fx/api/og-video/shared/b71991c5-13b2-4056-80f4-e1237802214a";

function useTheme(){
  const [theme, setTheme] = useState('dark');
  useEffect(() => {
    let saved = null;
    try { saved = localStorage.getItem('carnet-theme'); } catch (e) {}
    const initial = saved === 'light' ? 'light' : 'dark';
    setTheme(initial);
  }, []);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B0F14' : '#F4F6F9');
    try { localStorage.setItem('carnet-theme', theme); } catch (e) {}
  }, [theme]);
  return [theme, setTheme];
}

function useReveal(){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    if (!ref.current || !('IntersectionObserver' in window)) { setInView(true); return; }
    const obs = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) { setInView(true); obs.unobserve(entry.target); } });
    }, { threshold: 0.15 });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function ThemeToggle({ theme, setTheme }){
  return (
    <div className="theme-toggle">
      <button type="button" className={"theme-opt" + (theme === 'light' ? ' active' : '')} onClick={() => setTheme('light')}>Clair</button>
      <button type="button" className={"theme-opt" + (theme === 'dark' ? ' active' : '')} onClick={() => setTheme('dark')}>Sombre</button>
    </div>
  );
}

function Header({ theme, setTheme }){
  return (
    <header className="site-header">
      <div className="wrap">
        <div className="glass-bar">
          <div className="brand"><span className="brand-mark">L</span>Loyer Pro</div>
          <div className="nav-actions">
            <ThemeToggle theme={theme} setTheme={setTheme} />
            <a href="carnet-gestion-locative.html" className="btn-glass">Se connecter</a>
          </div>
        </div>
      </div>
    </header>
  );
}

function Hero(){
  const videoRef = useRef(null);
  const [videoFailed, setVideoFailed] = useState(false);

  return (
    <div className="hero">
      <video ref={videoRef} src={HERO_VIDEO_SRC} autoPlay muted loop playsInline preload="auto"
             onError={() => setVideoFailed(true)} style={{ opacity: videoFailed ? 0 : 1 }} />
      <div className="hero-overlay"></div>
      <div className="hero-content">
        <h1>Tous tes loyers, sous contrôle.</h1>
        <p>Biens, locataires, paiements et quittances — centralisés au même endroit, accessibles depuis ton téléphone. Fini les carnets papier et les loyers oubliés.</p>
        <div className="hero-actions">
          <a href="carnet-gestion-locative.html" className="btn-primary">Essayer gratuitement — 7 jours</a>
          <a href="#tarifs" className="btn-glass">Voir les tarifs</a>
        </div>
        <p className="hero-note">Aucune carte bancaire requise pour commencer.</p>
      </div>
      <div className="scroll-cue"><span></span>Défiler</div>
    </div>
  );
}

const FEATURES = [
  { size: 'lg', title: 'Paiements, toutes méthodes', text: "Enregistre chaque loyer reçu, quelle que soit la méthode utilisée par ton locataire.",
    iconType: 'paiements', chips: ['Orange Money','MTN','Moov','Wave','Espèces'] },
  { size: 'sm', title: "Tes biens, en un coup d'œil", text: 'Loyer, quartier, statut — occupé ou vacant.',
    iconType: 'biens' },
  { size: 'sm', title: 'Chaque locataire suivi', text: 'Coordonnées et historique de paiement au même endroit.',
    iconType: 'locataires' },
  { size: 'wide', title: 'Un assistant qui connaît tes données', text: 'Pose une question en langage courant, obtiens une réponse immédiate.',
    iconType: 'assistant', chat: true },
  { size: 'sm', title: 'Quittances en un clic', text: 'Un reçu PDF prêt à envoyer, à chaque paiement.',
    iconType: 'quittance' },
  { size: 'sm', title: 'Maintenance suivie', text: "Priorité et statut jusqu'à la résolution.",
    iconType: 'maintenance' },
  { size: 'sm', title: 'Rapports clairs', text: 'Revenus, retards, occupation — exportables en CSV.',
    iconType: 'rapports' },
];

function FeatureIcon({ type }){
  const props = { viewBox: "0 0 20 20", fill: "none", stroke: "currentColor", strokeWidth: "1.6" };
  if (type === 'biens') return <svg {...props}><rect x="4" y="3" width="12" height="14" rx="1"/><line x1="4" y1="8" x2="16" y2="8"/><line x1="4" y1="13" x2="16" y2="13"/><line x1="9" y1="3" x2="9" y2="17"/></svg>;
  if (type === 'locataires') return <svg {...props}><circle cx="10" cy="7" r="3"/><path d="M4 17a6 6 0 0 1 12 0"/></svg>;
  if (type === 'quittance') return <svg {...props}><rect x="4" y="2" width="12" height="16" rx="1"/><line x1="7" y1="6" x2="13" y2="6"/><line x1="7" y1="10" x2="13" y2="10"/><path d="M7 14l2 2 4-4"/></svg>;

  if (type === 'assistant') return <svg {...props}><rect x="2" y="4" width="16" height="10" rx="3"/><polygon points="6,14 6,18 10,14" fill="currentColor" stroke="none"/></svg>;
  return <svg {...props}><rect x="2" y="5" width="16" height="11" rx="2"/><path d="M2 9h16"/><circle cx="14" cy="13" r="1.2"/></svg>;
}

function Showcase(){
  const slides = [
    { node: <DashboardSlide />, caption: "Tableau de bord — revenus et retards en un coup d'œil" },
    { node: <PaymentsSlide />, caption: 'Paiements — chaque loyer, chaque méthode, enregistré' },
    { node: <AssistantSlide />, caption: 'Assistant IA — réponses immédiates sur tes données' },
  ];
  const [active, setActive] = useState(0);
  const timerRef = useRef(null);
  const [ref, inView] = useReveal();

  const start = useCallback(() => {
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => setActive(a => (a + 1) % slides.length), 4500);
  }, [slides.length]);

  useEffect(() => { start(); return () => clearInterval(timerRef.current); }, [start]);

  const goTo = (i) => { setActive(i); start(); };

  return (
    <section>
      <div className="wrap">
        <div className="section-head">
          <h2>Découvre l'app en images</h2>
          <p>Un aperçu de ce que tu retrouves une fois connecté.</p>
        </div>
        <div ref={ref} className={"carousel-wrap reveal" + (inView ? ' in-view' : '')}>
          <div className="carousel-viewport">
            {slides[active].node}
          </div>
          <p className="slide-caption">{slides[active].caption}</p>
          <div className="carousel-dots">
            {slides.map((s, i) => (
              <button key={i} className={"dot" + (i === active ? ' active' : '')} onClick={() => goTo(i)} aria-label={"Diapositive " + (i + 1)}></button>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}
